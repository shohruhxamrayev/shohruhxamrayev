<script src="books-data.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var grid = document.getElementById('collectionGrid');
    if (!grid || typeof booksData === 'undefined') return;
    booksData.forEach(function (book) {
      var card = document.createElement('a');
      card.className = 'book-card';
      card.href = 'books.html#' + book.slug;
      card.innerHTML =
        '<img class="book-card-cover" src="' + book.cover + '" alt="' + book.title + ' cover">' +
        '<div class="book-card-title">' + book.title + '</div>' +
        '<div class="book-card-author">' + book.author + '</div>';
      grid.appendChild(card);
    });
  });
</script>
